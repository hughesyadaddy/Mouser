# Target content for hughesyadaddy/Mouser:.github/workflows/release.yml
# (staged here because this fix was authored from the deskflow worktree; copy
# verbatim into the Mouser repo). Replaces the workflow that published an
# unsigned Windows zip and whose macOS job exited 2 for lack of
# MOUSER_SIGN_IDENTITY.
#
# Signing gates:
#   build-macos   runs only when secrets.MOUSER_SIGN_IDENTITY is set (plus
#                 MOUSER_SIGN_P12 / MOUSER_SIGN_P12_PASSWORD to import the
#                 cert into a throwaway keychain); otherwise it is SKIPPED
#                 with a warning annotation.
#   build-windows runs only when secrets.FLEET_SIGN_PFX (base64 PFX, optional
#                 FLEET_SIGN_PFX_PASSWORD) is set; signs dist\Mouser with
#                 deskflow/scripts/sign-windows.ps1 (.exe/.dll/.pyd/.sys, RFC
#                 3161 timestamp mandatory); otherwise SKIPPED with a warning.
#   release       runs on tags only and FAILS (never publishes) unless every
#                 platform build succeeded, so an unsigned artifact can never
#                 reach a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MOUSER_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  MOUSER_GIT_COMMIT: ${{ github.sha }}
  MOUSER_GIT_DIRTY: "false"
  # deskflow checkout that provides scripts/sign-windows.ps1.
  DESKFLOW_REPO: hughesyadaddy/deskflow
  DESKFLOW_REF: ${{ vars.DESKFLOW_REF || 'fleet/memory-program' }}

jobs:
  # `secrets` is not available in a job-level `if`, so resolve the signing
  # gates once here and fan out via outputs.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      mac_signing: ${{ steps.gate.outputs.mac_signing }}
      win_signing: ${{ steps.gate.outputs.win_signing }}
    steps:
      - id: gate
        env:
          HAS_MAC_IDENTITY: ${{ secrets.MOUSER_SIGN_IDENTITY != '' }}
          HAS_WIN_PFX: ${{ secrets.FLEET_SIGN_PFX != '' }}
        run: |
          echo "mac_signing=$HAS_MAC_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "win_signing=$HAS_WIN_PFX" >> "$GITHUB_OUTPUT"
          if [ "$HAS_MAC_IDENTITY" != "true" ]; then
            echo "::warning title=build-macos skipped::secrets.MOUSER_SIGN_IDENTITY is not set. Unsigned macOS builds are never produced or published; add MOUSER_SIGN_IDENTITY (SHA-1 of the codesigning identity), MOUSER_SIGN_P12 (base64 .p12) and MOUSER_SIGN_P12_PASSWORD to enable the job."
          fi
          if [ "$HAS_WIN_PFX" != "true" ]; then
            echo "::warning title=build-windows skipped::secrets.FLEET_SIGN_PFX is not set. Unsigned Windows builds are never produced or published; add FLEET_SIGN_PFX (base64 .pfx) and FLEET_SIGN_PFX_PASSWORD to enable the job."
          fi

  build-windows:
    needs: preflight
    if: needs.preflight.outputs.win_signing == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out deskflow (sign-windows.ps1)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DESKFLOW_REPO }}
          ref: ${{ env.DESKFLOW_REF }}
          path: deskflow
          sparse-checkout: |
            scripts/sign-windows.ps1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller Mouser.spec --noconfirm

      - name: Import fleet signing certificate
        shell: pwsh
        env:
          FLEET_SIGN_PFX: ${{ secrets.FLEET_SIGN_PFX }}
          FLEET_SIGN_PFX_PASSWORD: ${{ secrets.FLEET_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'fleet-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:FLEET_SIGN_PFX))
          try {
            $args = @{ FilePath = $pfx; CertStoreLocation = 'Cert:\CurrentUser\My' }
            if ($env:FLEET_SIGN_PFX_PASSWORD) {
              $args.Password = ConvertTo-SecureString $env:FLEET_SIGN_PFX_PASSWORD -AsPlainText -Force
            }
            $cert = Import-PfxCertificate @args
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          if (-not $cert -or -not $cert.Thumbprint) { throw 'FLEET_SIGN_PFX did not import a certificate.' }
          "DESKFLOW_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported signing certificate $($cert.Thumbprint) ($($cert.Subject))"

      - name: Sign dist (exe/dll/pyd/sys, timestamped) and verify
        shell: pwsh
        # sign-windows.ps1 throws on any unsigned/mismatched file and refuses
        # to sign without a timestamp (no -AllowNoTimestamp here).
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD\deskflow\scripts\sign-windows.ps1" -Root "$PWD\dist\Mouser" -EnvFile "$env:RUNNER_TEMP\no.env"
          if ($LASTEXITCODE) { throw "sign-windows.ps1 exited $LASTEXITCODE" }

      - name: Create archive
        run: Compress-Archive -Path dist\Mouser -DestinationPath Mouser-Windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Mouser-Windows
          path: Mouser-Windows.zip

  build-macos:
    name: build-macos (${{ matrix.name }})
    needs: preflight
    if: needs.preflight.outputs.mac_signing == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            python_architecture: arm64
            pyinstaller_target_arch: arm64
            artifact_name: Mouser-macOS
            archive_name: Mouser-macOS.zip
          - name: Intel
            runner: macos-15-intel
            python_architecture: x64
            pyinstaller_target_arch: x86_64
            artifact_name: Mouser-macOS-intel
            archive_name: Mouser-macOS-intel.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import signing certificate into a throwaway keychain
        env:
          MOUSER_SIGN_P12: ${{ secrets.MOUSER_SIGN_P12 }}
          MOUSER_SIGN_P12_PASSWORD: ${{ secrets.MOUSER_SIGN_P12_PASSWORD }}
          MOUSER_SIGN_IDENTITY: ${{ secrets.MOUSER_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${MOUSER_SIGN_P12:-}" ]; then
            echo "::error::MOUSER_SIGN_IDENTITY is set but MOUSER_SIGN_P12 (base64 .p12) is not; cannot sign." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/mouser-sign.keychain-db"
          KEYCHAIN_PW="$(head -c 32 /dev/urandom | base64)"
          P12="$RUNNER_TEMP/mouser-sign.p12"
          echo "$MOUSER_SIGN_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -P "${MOUSER_SIGN_P12_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$MOUSER_SIGN_IDENTITY"; then
            echo "::error::identity $MOUSER_SIGN_IDENTITY not found in the imported .p12" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi

      - name: Build macOS app (signed)
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstaller_target_arch }}
          MOUSER_SIGN_IDENTITY: ${{ secrets.MOUSER_SIGN_IDENTITY }}
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh

      - name: Verify signature is not ad-hoc
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Mouser.app
          info="$(codesign -dvv dist/Mouser.app 2>&1)"
          if echo "$info" | grep -qE 'Signature=adhoc|flags=.*adhoc'; then
            echo "::error::dist/Mouser.app is ad-hoc signed; refusing to publish." >&2
            echo "$info"; exit 1
          fi
          echo "$info" | grep -E 'Identifier=|Authority=|TeamIdentifier=|flags='

      - name: Create archive
        run: cd dist && zip -r -y "../${{ matrix.archive_name }}" Mouser.app

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-util1 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller Mouser-linux.spec --noconfirm

      - name: Audit Linux bundle dependencies
        run: |
          python - <<'PY'
          import os
          import pathlib
          import stat
          import subprocess

          bundle_root = os.path.join("dist", "Mouser")
          if not os.path.isdir(bundle_root):
              raise SystemExit(f"Missing bundle directory: {bundle_root}")

          bundle_root_path = pathlib.Path(bundle_root).resolve()
          internal_root = bundle_root_path / "_internal"
          pyside_root = internal_root / "PySide6"
          hidapi_root = internal_root / "hidapi.libs"

          def is_elf(path: str) -> bool:
              try:
                  mode = os.stat(path).st_mode
              except OSError:
                  return False
              if not stat.S_ISREG(mode):
                  return False
              with open(path, "rb") as fh:
                  return fh.read(4) == b"\x7fELF"

          library_dirs = []
          for root, _, files in os.walk(bundle_root):
              if any(".so" in name for name in files):
                  library_dirs.append(root)

          ld_library_path = ":".join(dict.fromkeys(library_dirs))
          env = os.environ.copy()
          if ld_library_path:
              env["LD_LIBRARY_PATH"] = ld_library_path

          def should_audit(path: pathlib.Path) -> bool:
              if path == bundle_root_path / "Mouser":
                  return True
              try:
                  relative = path.relative_to(pyside_root)
                  return "plugins" not in relative.parts and "qml" not in relative.parts
              except ValueError:
                  pass
              try:
                  path.relative_to(hidapi_root)
                  return True
              except ValueError:
                  return False

          missing = []
          for root, _, files in os.walk(bundle_root):
              for name in files:
                  path = pathlib.Path(root, name).resolve()
                  if not is_elf(str(path)) or not should_audit(path):
                      continue
                  result = subprocess.run(
                      ["ldd", str(path)],
                      check=False,
                      capture_output=True,
                      text=True,
                      env=env,
                  )
                  output = result.stdout + result.stderr
                  unresolved = [
                      line.strip()
                      for line in output.splitlines()
                      if "not found" in line
                  ]
                  if unresolved:
                      missing.append((path, unresolved))

          if missing:
              for path, unresolved in missing:
                  print(path)
                  for line in unresolved:
                      print(f"  {line}")
              raise SystemExit("Linux bundle contains unresolved shared-library dependencies")
          PY

      - name: Smoke test Linux bundle startup
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout --kill-after=5s 15s ./dist/Mouser/Mouser
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            exit "$status"
          fi

      - name: Add Linux permission helper
        run: |
          cp packaging/linux/69-mouser-logitech.rules dist/Mouser/
          cp packaging/linux/install-linux-permissions.sh dist/Mouser/
          chmod +x dist/Mouser/install-linux-permissions.sh

      - name: Create archive
        run: cd dist && zip -r -y ../Mouser-Linux.zip Mouser

      - uses: actions/upload-artifact@v7
        with:
          name: Mouser-Linux
          path: Mouser-Linux.zip

  release:
    # always() so a skipped build reaches this job and fails it loudly instead
    # of silently skipping the release (and instead of publishing a partial set).
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [preflight, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish unless every platform built signed
        env:
          WIN: ${{ needs.build-windows.result }}
          MAC: ${{ needs.build-macos.result }}
          LNX: ${{ needs.build-linux.result }}
        run: |
          rc=0
          for pair in "build-windows=$WIN" "build-macos=$MAC" "build-linux=$LNX"; do
            job="${pair%%=*}"; res="${pair#*=}"
            if [ "$res" != "success" ]; then
              echo "::error title=release blocked::$job result is '$res' (skipped = signing secret missing). Nothing is published." >&2
              rc=1
            fi
          done
          exit $rc

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate update metadata
        run: |
          mkdir -p update-assets
          cp Mouser-Windows/Mouser-Windows.zip update-assets/
          cp Mouser-macOS/Mouser-macOS.zip update-assets/
          cp Mouser-macOS-intel/Mouser-macOS-intel.zip update-assets/
          cp Mouser-Linux/Mouser-Linux.zip update-assets/
          python tools/generate_update_manifest.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --asset-dir update-assets \
            --output "mouser-${{ github.ref_name }}-update.json"

      - uses: actions/upload-artifact@v7
        with:
          name: Mouser-Update-Metadata
          path: mouser-${{ github.ref_name }}-update.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            # Release already exists — just upload the assets
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              Mouser-Windows/Mouser-Windows.zip \
              Mouser-macOS/Mouser-macOS.zip \
              Mouser-macOS-intel/Mouser-macOS-intel.zip \
              Mouser-Linux/Mouser-Linux.zip \
              mouser-${{ github.ref_name }}-update.json
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Mouser ${{ github.ref_name }}" \
              --generate-notes \
              Mouser-Windows/Mouser-Windows.zip \
              Mouser-macOS/Mouser-macOS.zip \
              Mouser-macOS-intel/Mouser-macOS-intel.zip \
              Mouser-Linux/Mouser-Linux.zip \
              mouser-${{ github.ref_name }}-update.json
          fi
